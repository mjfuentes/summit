[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --tb=short -v -m "not autonomous and not slow and not ci_only" --cov=src --cov-report=term-missing --cov-fail-under=60
pythonpath = .
markers =
    asyncio: marks tests as async
    autonomous: marks tests as autonomous integration tests (require Docker, not run by default)
    slow: marks tests as slow (may be skipped in local development)
    ci_only: marks tests that should only run in CI/CD environments 