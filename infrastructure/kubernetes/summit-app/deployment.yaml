apiVersion: apps/v1
kind: Deployment
metadata:
  name: summit-app
  namespace: summit
  labels:
    app: summit-app
    component: web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summit-app
  template:
    metadata:
      labels:
        app: summit-app
    spec:
      imagePullSecrets:
      - name: ghcr-login-secret
      serviceAccountName: summit-ksa
      containers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "PROJECT_ID:us-central1:summit-postgres"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      - name: summit
        image: ghcr.io/mjfuentes/summit:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://summit:summit123@localhost:5432/summit"
        - name: OPENCODE_ENDPOINT
          value: "http://opencode-service.summit.svc.cluster.local"
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: runpod-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: summit-data
          mountPath: /app/data
      volumes:
      - name: summit-data
        persistentVolumeClaim:
          claimName: summit-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: summit-service
  namespace: summit
spec:
  selector:
    app: summit-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: summit-data-pvc
  namespace: summit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: summit-ingress
  namespace: summit
  annotations:
    kubernetes.io/ingress.class: "gce"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - summit.yourdomain.com
    secretName: summit-tls
  rules:
  - host: summit.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: summit-service
            port:
              number: 80 