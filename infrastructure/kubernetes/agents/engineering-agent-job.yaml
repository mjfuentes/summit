apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-agent-template
  namespace: summit
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: "engineering-agent-${TASK_ID}"
      namespace: summit
      labels:
        app: engineering-agent
        component: ai-agent
        role: engineering
        task-id: "${TASK_ID}"
    spec:
      ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
      template:
        metadata:
          labels:
            app: engineering-agent
            role: engineering
            task-id: "${TASK_ID}"
        spec:
          restartPolicy: Never
          serviceAccountName: summit-agent-sa
          imagePullSecrets:
          - name: ghcr-login-secret
          initContainers:
          # Fast repository preparation
          - name: repo-init
            image: alpine/git:latest
            command: ["/bin/sh"]
            args:
            - -c
            - |
              echo "Cloning repository for task ${TASK_ID}..."
              cd /workspace
              git clone --depth 1 --single-branch --branch main ${REPO_URL} .
              git config user.name "Summit Engineering Agent"
              git config user.email "engineering-agent@summit.ai"
              echo "Repository ready for task ${TASK_ID}"
              touch /tmp/repo-ready
            env:
            - name: TASK_ID
              value: "${TASK_ID}"
            - name: REPO_URL
              value: "${REPO_URL}"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          containers:
          - name: engineering-agent
            image: gcr.io/summit-ai-platform/opencode:latest
            command: ["python"]
            args: ["/app/src/agent_task_executor.py"]
            env:
            - name: AGENT_ROLE
              value: "engineering"
            - name: TASK_ID
              value: "${TASK_ID}"
            - name: WORKFLOW_STAGE
              value: "second"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://summit:summit123@localhost:5432/summit"
            - name: WORKSPACE_PATH
              value: "/workspace"
            - name: PYTHONPATH
              value: "/app/src"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: summit-secrets
                  key: anthropic-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: summit-secrets
                  key: github-token
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: app-code
              mountPath: /app
            - name: tmp
              mountPath: /tmp
          # Cloud SQL Proxy sidecar
          - name: cloud-sql-proxy
            image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
            args:
              - "--structured-logs"
              - "--port=5432"
              - "summit-ai-platform:us-central1:summit-postgres"
            securityContext:
              runAsNonRoot: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "64Mi"
                cpu: "50m"
          volumes:
          - name: workspace
            emptyDir: {}
          - name: app-code
            configMap:
              name: summit-agent-code
          - name: tmp
            emptyDir: {}
---
# Job launcher service that creates engineering agent jobs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-job-launcher
  namespace: summit
  labels:
    app: engineering-job-launcher
    component: job-launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engineering-job-launcher
  template:
    metadata:
      labels:
        app: engineering-job-launcher
    spec:
      serviceAccountName: summit-agent-sa
      containers:
      - name: job-launcher
        image: gcr.io/summit-ai-platform/opencode:latest
        command: ["python"]
        args: ["/app/src/engineering_job_launcher.py"]
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://summit:summit123@localhost:5432/summit"
        - name: PYTHONPATH
          value: "/app/src"
        - name: JOB_TEMPLATE_CONFIG
          value: "engineering-agent-template"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: app-code
          mountPath: /app
      # Cloud SQL Proxy sidecar
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "summit-ai-platform:us-central1:summit-postgres"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: app-code
        configMap:
          name: summit-agent-code 