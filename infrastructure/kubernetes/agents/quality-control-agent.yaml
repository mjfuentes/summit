apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-control-agent
  namespace: summit
  labels:
    app: quality-control-agent
    component: ai-agent
    role: quality-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-control-agent
  template:
    metadata:
      labels:
        app: quality-control-agent
        role: quality-control
    spec:
      serviceAccountName: summit-agent-sa
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - name: quality-control-agent
        image: ghcr.io/mjfuentes/summit/opencode-agents:latest
        command: ["/bin/bash"]
        args: ["-c", "mkdir -p ~/.opencode && echo '{\"mcpServers\":{\"summit\":{\"type\":\"sse\",\"url\":\"http://summit-mcp-service.summit.svc.cluster.local:8080\"}},\"providers\":{\"anthropic\":{\"apiKey\":\"'\"$ANTHROPIC_API_KEY\"'\"}},\"agents\":{\"coder\":{\"model\":\"claude-3.5-sonnet\",\"maxTokens\":8000}}}' > ~/.opencode/config.json && cd /workspace && opencode -p 'I am a Summit Quality Control Agent. Register with Summit MCP server using summit_register_agent tool with role=quality-control and capabilities=[\"code-review\",\"testing\",\"quality-assurance\",\"documentation\"]. Check for tasks with summit_get_next_task and perform quality reviews.'"]
        env:
        - name: AGENT_ROLE
          value: "quality_control"
        - name: AGENT_ID
          value: "quality-control-agent-001"
        - name: WORKSPACE_PATH
          value: "/workspace"
        - name: SUMMIT_MCP_SERVER_URL
          value: "summit-mcp-service.summit.svc.cluster.local:8080"
        - name: GIT_CLEANUP_ENABLED
          value: "true"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "ps aux | grep opencode | grep -v grep"
          initialDelaySeconds: 45
          periodSeconds: 15
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: app-code
          mountPath: /app
        - name: git-cache
          mountPath: /git-cache
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: quality-control-workspace
      - name: app-code
        configMap:
          name: summit-agent-code
      - name: git-cache
        emptyDir: {}
---
# Persistent volume for Quality Control to maintain context
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quality-control-workspace
  namespace: summit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-control-agent-hpa
  namespace: summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-control-agent
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: "quality-control-tasks"
      target:
        type: AverageValue
        averageValue: "3"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 120 