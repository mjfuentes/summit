apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-control-agent
  namespace: summit
  labels:
    app: quality-control-agent
    component: ai-agent
    role: quality-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-control-agent
  template:
    metadata:
      labels:
        app: quality-control-agent
        role: quality-control
    spec:
      serviceAccountName: summit-agent-sa
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - name: quality-control-agent
        image: ghcr.io/mjfuentes/summit/agent:latest
        command: ["python"]
        args: ["/app/src/agent_lifecycle.py"]
        env:
        - name: AGENT_ROLE
          value: "quality_control"
        - name: WORKFLOW_STAGE
          value: "final"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://summit:summit123@localhost:5432/summit"
        - name: WORKSPACE_PATH
          value: "/workspace"
        - name: PYTHONPATH
          value: "/app/src"
        - name: AGENT_HEARTBEAT_INTERVAL
          value: "60"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        resources:
          requests:
            memory: "192Mi"
            cpu: "150m"
          limits:
            memory: "384Mi"
            cpu: "300m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import requests; requests.get('http://localhost:8080/health')"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import os; exit(0 if os.path.exists('/tmp/agent-ready') else 1)"
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: app-code
          mountPath: /app
        - name: git-cache
          mountPath: /git-cache
      # Cloud SQL Proxy sidecar for database access
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "PROJECT_ID:us-central1:summit-postgres"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: quality-control-workspace
      - name: app-code
        configMap:
          name: summit-agent-code
      - name: git-cache
        emptyDir: {}
---
# Persistent volume for Quality Control to maintain context
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quality-control-workspace
  namespace: summit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-control-agent-hpa
  namespace: summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-control-agent
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: "quality-control-tasks"
      target:
        type: AverageValue
        averageValue: "3"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 120 