apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-agent
  namespace: summit
  labels:
    app: engineering-agent
    component: ai-agent
    role: engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engineering-agent
  template:
    metadata:
      labels:
        app: engineering-agent
        role: engineering
    spec:
      serviceAccountName: summit-agent-sa
      imagePullSecrets:
      - name: ghcr-login-secret
      initContainers:
      # Initialize repository once at startup
      - name: repo-init
        image: alpine/git:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Initializing repository for engineering agent..."
          cd /workspace
          
          # Clean up any existing content
          if [ "$(ls -A /workspace)" ]; then
            echo "Workspace not empty, cleaning up..."
            rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true
          fi
          
          # Clone repository using GitHub token for authentication
          REPO_URL_WITH_TOKEN="https://${GITHUB_TOKEN}@github.com/mjfuentes/summit.git"
          echo "Cloning repository with authentication..."
          git clone --depth 10 "$REPO_URL_WITH_TOKEN" . || {
            echo "Clone with token failed, trying fallback methods..."
            git clone --depth 10 "https://github.com/mjfuentes/summit.git" . || {
              echo "ERROR: All git clone attempts failed"
              exit 1
            }
          }
          
          git config user.name "Summit Engineering Agent"
          git config user.email "engineering-agent@summit.ai"
          git config pull.rebase false
          echo "Repository initialized successfully"
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      containers:
      - name: engineering-agent
        image: ghcr.io/mjfuentes/summit/opencode-agents:latest
        command: ["/bin/bash"]
        args: ["-c", "mkdir -p ~/.opencode && echo '{\"mcpServers\":{\"summit\":{\"type\":\"sse\",\"url\":\"http://summit-mcp-service.summit.svc.cluster.local:8080\"}},\"providers\":{\"anthropic\":{\"apiKey\":\"'\"$ANTHROPIC_API_KEY\"'\"}},\"agents\":{\"coder\":{\"model\":\"claude-3.5-sonnet\",\"maxTokens\":8000}}}' > ~/.opencode/config.json && cd /workspace && opencode -p 'I am a Summit Engineering Agent. Register with Summit FastMCP server using summit_register_agent tool with role=engineering and capabilities=[\"code-development\",\"bug-fixing\",\"testing\",\"deployment\"]. Check for tasks with summit_get_next_task. When you get a task, implement the solution based on the task details, test it, and create a PR.'"]
        env:
        - name: AGENT_ROLE
          value: "engineering"
        - name: AGENT_ID
          value: "engineering-agent-001"
        - name: WORKSPACE_PATH
          value: "/workspace"
        - name: SUMMIT_MCP_SERVER_URL
          value: "summit-mcp-service.summit.svc.cluster.local:8080"
        - name: GIT_CLEANUP_ENABLED
          value: "true"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "ps aux | grep opencode | grep -v grep"
          initialDelaySeconds: 45
          periodSeconds: 15
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: app-code
          mountPath: /app
        - name: git-scripts
          mountPath: /scripts
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: engineering-workspace
      - name: app-code
        configMap:
          name: summit-agent-code
      - name: git-scripts
        configMap:
          name: git-cleanup-scripts
          defaultMode: 0755
---
# Persistent volume for Engineering agent workspace
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engineering-workspace
  namespace: summit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Git cleanup scripts for engineering agent
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-cleanup-scripts
  namespace: summit
data:
  cleanup-git.sh: |
    #!/bin/bash
    set -e
    
    echo " Starting git cleanup for task: ${TASK_ID}"
    cd /workspace
    
    # Step 1: Reset any local changes
    echo "  Resetting local changes..."
    git reset --hard HEAD
    
    # Step 2: Clean untracked files
    echo "  Cleaning untracked files..."
    git clean -fd
    
    # Step 3: Return to main branch
    echo "  Switching to main branch..."
    git checkout main 2>/dev/null || git checkout master
    
    # Step 4: Get latest changes (fast)
    echo "  Pulling latest changes..."
    git pull origin main --depth 1 2>/dev/null || git pull origin master --depth 1
    
    # Step 5: Create fresh feature branch
    if [ -n "${TASK_ID}" ]; then
        BRANCH_NAME="feature/task-${TASK_ID}"
        echo "  Creating feature branch: ${BRANCH_NAME}"
        git checkout -b "${BRANCH_NAME}"
    fi
    
    echo " Git cleanup complete - ready for task ${TASK_ID}"
    
  reset-agent.sh: |
    #!/bin/bash
    set -e
    
    echo " Full agent reset..."
    
    # Git cleanup
    /scripts/cleanup-git.sh
    
    # Clean temp directories
    echo "  Cleaning temp directories..."
    rm -rf /tmp/agent-* || true
    rm -rf /workspace/.cache/* || true
    rm -rf /workspace/temp/* || true
    
    # Reset environment
    echo "  Resetting environment..."
    unset TASK_ID CURRENT_BRANCH || true
    
    echo " Agent reset complete"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engineering-agent-hpa
  namespace: summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engineering-agent
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: "engineering-tasks"
      target:
        type: AverageValue
        averageValue: "2"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60 