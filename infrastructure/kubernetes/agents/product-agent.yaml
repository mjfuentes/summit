apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-agent
  namespace: summit
  labels:
    app: product-agent
    component: ai-agent
    role: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-agent
  template:
    metadata:
      labels:
        app: product-agent
        role: product
    spec:
      serviceAccountName: summit-agent-sa
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - name: product-agent
        image: ghcr.io/mjfuentes/summit/opencode-agents:latest
        command: ["/bin/bash"]
        args: ["-c", "mkdir -p ~/.opencode && echo '{\"mcpServers\":{\"summit\":{\"type\":\"sse\",\"url\":\"http://summit-mcp-service.summit.svc.cluster.local:8080\"}},\"providers\":{\"anthropic\":{\"apiKey\":\"'\"$ANTHROPIC_API_KEY\"'\"}},\"agents\":{\"coder\":{\"model\":\"claude-3.5-sonnet\",\"maxTokens\":8000}}}' > ~/.opencode/config.json && cd /workspace && opencode -p 'I am a Summit Product Agent. Register with Summit MCP server using summit_register_agent tool with role=product and capabilities=[\"product-planning\",\"requirements-analysis\",\"stakeholder-communication\"]. Then check for tasks using summit_get_next_task and begin working.'"]
        env:
        - name: AGENT_ROLE
          value: "product"
        - name: AGENT_ID
          value: "product-agent-001"
        - name: WORKSPACE_PATH
          value: "/workspace"
        - name: SUMMIT_MCP_SERVER_URL
          value: "summit-mcp-service.summit.svc.cluster.local:8080"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "ps aux | grep opencode | grep -v grep"
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: app-code
          mountPath: /app
      volumes:
      - name: workspace
        emptyDir: {}
      - name: app-code
        configMap:
          name: summit-agent-code
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-agent-hpa
  namespace: summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-agent
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: "product-tasks"
      target:
        type: AverageValue
        averageValue: "2"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60 