apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-agent
  namespace: summit
  labels:
    app: product-agent
    component: ai-agent
    role: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-agent
  template:
    metadata:
      labels:
        app: product-agent
        role: product
    spec:
      serviceAccountName: summit-agent-sa
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - name: product-agent
        image: gcr.io/summit-ai-platform/opencode:latest
        command: ["python"]
        args: ["/app/src/agent_lifecycle.py"]
        env:
        - name: AGENT_ROLE
          value: "product"
        - name: WORKFLOW_STAGE
          value: "first"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://summit:summit123@localhost:5432/summit"
        - name: WORKSPACE_PATH
          value: "/workspace"
        - name: PYTHONPATH
          value: "/app/src"
        - name: AGENT_HEARTBEAT_INTERVAL
          value: "60"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: anthropic-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: summit-secrets
              key: github-token
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import requests; requests.get('http://localhost:8080/health')"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import os; exit(0 if os.path.exists('/tmp/agent-ready') else 1)"
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: app-code
          mountPath: /app
      # Cloud SQL Proxy sidecar for database access
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "summit-ai-platform:us-central1:summit-postgres"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: workspace
        emptyDir: {}
      - name: app-code
        configMap:
          name: summit-agent-code
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-agent-hpa
  namespace: summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-agent
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: "product-tasks"
      target:
        type: AverageValue
        averageValue: "2"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60 