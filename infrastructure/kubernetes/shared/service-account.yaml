apiVersion: v1
kind: ServiceAccount
metadata:
  name: summit-agent-sa
  namespace: summit
  annotations:
    iam.gke.io/gcp-service-account: summit-agent@summit-ai-platform.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
metadata:
  name: google-cloud-key
  namespace: summit
type: Opaque
data:
  key.json: # This will be populated with the service account key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: summit-agent-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: summit-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: summit-agent-role
subjects:
- kind: ServiceAccount
  name: summit-agent-sa
  namespace: summit 