apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-agent
  namespace: summit
  labels:
    app: opencode-agent
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-agent
  template:
    metadata:
      labels:
        app: opencode-agent
        version: "1.0.0"
    spec:
      containers:
      - name: opencode-agent
        image: ghcr.io/mjfuentes/opencode-agent:latest
        imagePullPolicy: Always
        env:
        - name: VERTEXAI_PROJECT
          value: "summit-ai-platform"
        - name: VERTEXAI_LOCATION
          value: "us-central1"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/secrets/google/key.json"
        volumeMounts:
        - name: google-cloud-key
          mountPath: /var/secrets/google
          readOnly: true
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Keep container running for interactive use
        command: ["/entrypoint.sh"]
        tty: true
        stdin: true
      volumes:
      - name: google-cloud-key
        secret:
          secretName: google-cloud-key
      - name: workspace
        emptyDir: {}
      serviceAccountName: opencode-agent-sa
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-agent-sa
  namespace: summit
  annotations:
    iam.gke.io/gcp-service-account: opencode-agent@summit-ai-platform.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-agent-service
  namespace: summit
spec:
  selector:
    app: opencode-agent
  ports:
  - name: ssh
    port: 22
    targetPort: 22
  type: ClusterIP 