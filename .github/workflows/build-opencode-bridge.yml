name: Build and Deploy OpenCode Bridge Handler

on:
  push:
    branches: [ main ]
    paths:
      - 'opencode-bridge/**'
      - '.github/workflows/build-opencode-bridge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'opencode-bridge/**'
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/opencode-bridge
  CONTEXT_PATH: opencode-bridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.CONTEXT_PATH }}
        file: ${{ env.CONTEXT_PATH }}/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate summary
      run: |
        echo "##  OpenCode Bridge Handler Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Image Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  RunPod Deployment" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to [RunPod Console](https://www.runpod.ai/console/serverless)" >> $GITHUB_STEP_SUMMARY
        echo "2. Create new template with image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "3. Deploy as serverless endpoint" >> $GITHUB_STEP_SUMMARY
        echo "4. Update bridge service with new endpoint ID" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify image exists
      id: verify-image
      run: |
        echo "Verifying image exists: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest; then
          echo "image-exists=true" >> $GITHUB_OUTPUT
          echo " Image found in registry"
        else
          echo "image-exists=false" >> $GITHUB_OUTPUT
          echo " Image not found in registry"
          exit 1
        fi

    - name: Run Trivy vulnerability scanner
      id: trivy-scan
      if: steps.verify-image.outputs.image-exists == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'  # Don't fail the workflow on vulnerabilities
        timeout: '10m'  # Add timeout
      continue-on-error: true

    - name: Check if SARIF file exists
      id: check-sarif
      run: |
        if [ -f "trivy-results.sarif" ]; then
          echo "sarif-exists=true" >> $GITHUB_OUTPUT
          echo "SARIF file generated successfully"
          ls -la trivy-results.sarif
        else
          echo "sarif-exists=false" >> $GITHUB_OUTPUT
          echo "SARIF file not found, skipping upload"
        fi

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check-sarif.outputs.sarif-exists == 'true'
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Generate security summary
      run: |
        echo "##  Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.check-sarif.outputs.sarif-exists }}" == "true" ]; then
          echo " Trivy security scan completed successfully" >> $GITHUB_STEP_SUMMARY
          echo " Results uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
        else
          echo " Trivy security scan encountered issues" >> $GITHUB_STEP_SUMMARY
          echo " Check workflow logs for details" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image scanned:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY 