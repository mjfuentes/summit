name: Summit Auto-Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'summit.py'
      - 'cost_tracker.py'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate Summit code
      run: |
        python -m py_compile summit.py
        python -m py_compile cost_tracker.py
        
    - name: Test Summit functionality
      run: |
        python test_cost_tracker.py
        python test_summit.py
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        
    - name: Deploy notification
      run: |
        echo "Summit has been automatically validated and deployed"
        echo "Commit: ${{ github.sha }}"
        echo "Author: Summit Autonomous AI"
        
