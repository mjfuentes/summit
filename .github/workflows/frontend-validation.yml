name: Frontend Validation with Render Preview

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/**'
      - 'static/**'
      - 'web/autonomous_server.py'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

env:
  RENDER_API_URL: https://api.render.com/v1
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  setup-preview:
    name: Setup Render Preview Environment
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.create-preview.outputs.preview-url }}
      preview-id: ${{ steps.create-preview.outputs.preview-id }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Add render-preview label to PR
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.payload.pull_request?.number || 
                          '${{ github.event.inputs.pr_number }}';
          
          if (prNumber) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['render-preview']
            });
          }
    
    - name: Wait for Render preview environment
      id: create-preview
      run: |
        echo "Waiting for Render to create preview environment..."
        
        # Increased timeout to 15 minutes (900 seconds)
        TIMEOUT=900
        INTERVAL=30
        elapsed=0
        
        while [ $elapsed -lt $TIMEOUT ]; do
          echo "Checking for preview environment... (${elapsed}s elapsed)"
          
          # Check if preview environment is ready
          # This is a placeholder - actual implementation would check Render API
          # For now, we'll simulate the wait and assume success after reasonable time
          
          if [ $elapsed -ge 300 ]; then
            # After 5 minutes, assume preview is ready
            # In real implementation, this would check actual Render API status
            echo "preview-url=https://summit-preview-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}.onrender.com" >> $GITHUB_OUTPUT
            echo "preview-id=summit-preview-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "Preview environment ready!"
            exit 0
          fi
          
          sleep $INTERVAL
          elapsed=$((elapsed + INTERVAL))
        done
        
        echo "Timeout waiting for preview environment after ${TIMEOUT} seconds"
        exit 1

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    needs: setup-preview
    if: needs.setup-preview.outputs.preview-url != ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Playwright
      run: |
        npm install -D @playwright/test
        npx playwright install chromium
        
    - name: Wait for preview deployment to be fully ready
      run: |
        echo "Waiting for preview deployment to be fully ready..."
        PREVIEW_URL="${{ needs.setup-preview.outputs.preview-url }}"
        
        # Wait up to 10 minutes for the preview to be fully deployed and responsive
        TIMEOUT=600
        INTERVAL=15
        elapsed=0
        
        while [ $elapsed -lt $TIMEOUT ]; do
          echo "Testing preview availability... (${elapsed}s elapsed)"
          
          if curl -f -s --max-time 10 "$PREVIEW_URL/health" > /dev/null 2>&1; then
            echo "Preview deployment is ready!"
            break
          fi
          
          if [ $elapsed -ge $((TIMEOUT - INTERVAL)) ]; then
            echo "Preview deployment not ready after ${TIMEOUT} seconds"
            exit 1
          fi
          
          sleep $INTERVAL
          elapsed=$((elapsed + INTERVAL))
        done
        
    - name: Run JavaScript error detection tests
      run: |
        cat > test-frontend-errors.js << 'EOF'
        const { test, expect } = require('@playwright/test');
        
        test('Frontend JavaScript Error Detection', async ({ page }) => {
          const errors = [];
          
          // Capture console errors
          page.on('console', msg => {
            if (msg.type() === 'error') {
              errors.push(msg.text());
            }
          });
          
          // Capture page errors
          page.on('pageerror', error => {
            errors.push(error.message);
          });
          
          // Navigate to the preview site
          await page.goto('${{ needs.setup-preview.outputs.preview-url }}', {
            waitUntil: 'networkidle',
            timeout: 60000
          });
          
          // Wait for page to fully load
          await page.waitForTimeout(5000);
          
          // Check for specific errors we're trying to prevent
          const hasFilterError = errors.some(error => 
            error.includes('tasks.filter is not a function')
          );
          const hasMapError = errors.some(error => 
            error.includes('tasks.map is not a function')
          );
          
                     // Log all errors for debugging
           if (errors.length > 0) {
             // JavaScript errors detected
           }
          
          // Test should fail if we detect the specific errors we're trying to prevent
          if (hasFilterError || hasMapError) {
            throw new Error('Frontend has JavaScript errors: ' + errors.join(', '));
          }
          
          // Test basic functionality
          await expect(page.locator('body')).toBeVisible();
          
          // Try to interact with task creation if available
          const taskInput = page.locator('input[placeholder*="task"], textarea[placeholder*="task"]');
          if (await taskInput.count() > 0) {
            await taskInput.first().fill('Test task for validation');
            
            // Wait a bit to see if any errors occur during interaction
            await page.waitForTimeout(2000);
                     }
           
           // Frontend validation completed successfully
        });
        EOF
        
        npx playwright test test-frontend-errors.js --reporter=line
        
    - name: Test API endpoints
      run: |
        PREVIEW_URL="${{ needs.setup-preview.outputs.preview-url }}"
        
        echo "Testing API endpoints..."
        
        # Test health endpoint
        if ! curl -f -s "$PREVIEW_URL/health"; then
          echo "Health endpoint failed"
          exit 1
        fi
        
        # Test tasks API endpoint (should return valid JSON)
        TASKS_RESPONSE=$(curl -f -s "$PREVIEW_URL/api/tasks" || echo "FAILED")
        if [ "$TASKS_RESPONSE" = "FAILED" ]; then
          echo "Tasks API endpoint failed"
          exit 1
        fi
        
        # Validate JSON response format
        echo "$TASKS_RESPONSE" | python3 -m json.tool > /dev/null
        if [ $? -ne 0 ]; then
          echo "Tasks API returned invalid JSON"
          exit 1
        fi
        
        echo "API endpoints validation completed successfully"

  report-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: [setup-preview, frontend-tests]
    if: always()
    
    steps:
    - name: Comment on PR with results
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.payload.pull_request?.number || 
                          '${{ github.event.inputs.pr_number }}';
          
          if (!prNumber) return;
          
          const setupSuccess = '${{ needs.setup-preview.result }}' === 'success';
          const testsSuccess = '${{ needs.frontend-tests.result }}' === 'success';
          const previewUrl = '${{ needs.setup-preview.outputs.preview-url }}';
          
          let status = '';
          let details = '';
          
          if (setupSuccess && testsSuccess) {
            status = 'Frontend validation passed';
            details = `
             **Frontend Validation Successful**
            
            - Preview environment created successfully
            - No JavaScript errors detected (tasks.filter/tasks.map issues resolved)
            - API endpoints responding correctly
            - Frontend functionality validated
            
            **Preview URL:** ${previewUrl}
            `;
          } else if (!setupSuccess) {
            status = 'Preview environment setup failed';
            details = `
             **Preview Environment Setup Failed**
            
            The Render.com preview environment could not be created within the 15-minute timeout.
            This may be due to:
            - Render.com resource constraints
            - Configuration issues
            - Network connectivity problems
            
            Please check the workflow logs and try again.
            `;
          } else {
            status = 'Frontend tests failed';
            details = `
             **Frontend Validation Failed**
            
            The preview environment was created but frontend tests failed.
            Please check the workflow logs for specific error details.
            
            **Preview URL:** ${previewUrl}
            `;
          }
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `## Frontend Validation Results\n\n**Status:** ${status}\n\n${details}`
          });

  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    needs: [setup-preview, frontend-tests, report-results]
    if: always() && needs.setup-preview.outputs.preview-id != ''
    
    steps:
    - name: Remove render-preview label
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.payload.pull_request?.number || 
                          '${{ github.event.inputs.pr_number }}';
          
          if (prNumber) {
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'render-preview'
              });
            } catch (error) {
              // Label may have already been removed
            }
          } 