name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'summit-ai-platform' }}
  CLUSTER_NAME: summit-cluster
  CLUSTER_REGION: us-central1

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Check Authentication Method
      id: auth-check
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      run: |
        if [ -n "${GCP_SA_KEY}" ]; then
          echo "auth_method=service_account" >> $GITHUB_OUTPUT
        elif [ -n "${WIF_PROVIDER}" ]; then
          echo "auth_method=workload_identity" >> $GITHUB_OUTPUT
        else
          echo "auth_method=none" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud (Service Account)
      if: steps.auth-check.outputs.auth_method == 'service_account'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Authenticate to Google Cloud (Workload Identity)
      if: steps.auth-check.outputs.auth_method == 'workload_identity'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Skip Authentication (No Credentials)
      if: steps.auth-check.outputs.auth_method == 'none'
      run: |
        echo "No GCP credentials configured. Skipping authentication."
        echo "This workflow will not be able to deploy to GCP."

    - name: Setup gcloud CLI
      if: steps.auth-check.outputs.auth_method != 'none'
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: infrastructure/terraform
      run: |
        terraform plan \
          -var="project_id=${{ env.GCP_PROJECT_ID }}" \
          -var="region=${{ env.CLUSTER_REGION }}" \
          -var="cluster_name=${{ env.CLUSTER_NAME }}" \
          -var="create_service_accounts=false" \
          -var="create_iam_bindings=false" \
          -var="enable_apis=false"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Check Authentication Method
      id: auth-check
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      run: |
        if [ -n "${GCP_SA_KEY}" ]; then
          echo "auth_method=service_account" >> $GITHUB_OUTPUT
        elif [ -n "${WIF_PROVIDER}" ]; then
          echo "auth_method=workload_identity" >> $GITHUB_OUTPUT
        else
          echo "auth_method=none" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud (Service Account)
      if: steps.auth-check.outputs.auth_method == 'service_account'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Authenticate to Google Cloud (Workload Identity)
      if: steps.auth-check.outputs.auth_method == 'workload_identity'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Skip Deployment (No Credentials)
      if: steps.auth-check.outputs.auth_method == 'none'
      run: |
        echo "No GCP credentials configured. Cannot deploy infrastructure."
        echo "Please configure either GCP_SA_KEY or WIF_PROVIDER secrets."
        exit 1

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: terraform init

    - name: Terraform Apply
      working-directory: infrastructure/terraform
      run: |
        terraform apply -auto-approve \
          -var="project_id=${{ env.GCP_PROJECT_ID }}" \
          -var="region=${{ env.CLUSTER_REGION }}" \
          -var="cluster_name=${{ env.CLUSTER_NAME }}" \
          -var="create_service_accounts=false" \
          -var="create_iam_bindings=false" \
          -var="enable_apis=false"

  deploy-applications:
    name: Deploy Applications
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Authentication Method
      id: auth-check
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      run: |
        if [ -n "${GCP_SA_KEY}" ]; then
          echo "auth_method=service_account" >> $GITHUB_OUTPUT
        elif [ -n "${WIF_PROVIDER}" ]; then
          echo "auth_method=workload_identity" >> $GITHUB_OUTPUT
        else
          echo "auth_method=none" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud (Service Account)
      if: steps.auth-check.outputs.auth_method == 'service_account'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Authenticate to Google Cloud (Workload Identity)
      if: steps.auth-check.outputs.auth_method == 'workload_identity'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: |
        gcloud auth configure-docker

    - name: Build and Push Docker Images
      run: |
        # Build Summit API image
        docker build -f infrastructure/docker/Dockerfile.summit-api -t gcr.io/${{ env.GCP_PROJECT_ID }}/summit-api:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/summit-api:latest
        
        # Build Summit MCP Server image
        docker build -f infrastructure/docker/Dockerfile.mcp-server -t gcr.io/${{ env.GCP_PROJECT_ID }}/summit-mcp-server:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/summit-mcp-server:latest
        
        # Build OpenCode image
        docker build -f web/Dockerfile.autonomous -t gcr.io/${{ env.GCP_PROJECT_ID }}/opencode:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/opencode:latest
        

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
          --region ${{ env.CLUSTER_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }}

    - name: Deploy Applications to Kubernetes
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        # Create namespace if it doesn't exist
        kubectl apply -f infrastructure/kubernetes/shared/namespace.yaml
        
        # Deploy shared resources
        kubectl apply -f infrastructure/kubernetes/shared/service-account.yaml
        
        # Update secrets with actual values (only if secrets are available)
        if [ -n "${RUNPOD_API_KEY}" ] || [ -n "${HUGGINGFACE_TOKEN}" ] || [ -n "${GITHUB_TOKEN}" ] || [ -n "${ANTHROPIC_API_KEY}" ]; then
          kubectl create secret generic summit-secrets \
            --from-literal=runpod-api-key="${RUNPOD_API_KEY:-placeholder}" \
            --from-literal=huggingface-token="${HUGGINGFACE_TOKEN:-placeholder}" \
            --from-literal=github-token="${GITHUB_TOKEN:-placeholder}" \
            --from-literal=anthropic-api-key="${ANTHROPIC_API_KEY:-placeholder}" \
            --namespace=summit \
            --dry-run=client -o yaml | kubectl apply -f -
        else
          echo "No application secrets configured. Creating placeholder secrets."
          kubectl create secret generic summit-secrets \
            --from-literal=runpod-api-key="placeholder" \
            --from-literal=huggingface-token="placeholder" \
            --from-literal=github-token="placeholder" \
            --from-literal=anthropic-api-key="placeholder" \
            --namespace=summit \
            --dry-run=client -o yaml | kubectl apply -f -
        fi
        
        # Deploy OpenCode agents
        kubectl apply -f infrastructure/kubernetes/opencode/deployment.yaml
        
        # Deploy Summit API
        kubectl apply -f infrastructure/kubernetes/summit-app/deployment.yaml
        
        # Deploy Summit MCP Server
        kubectl apply -f infrastructure/kubernetes/mcp-server/deployment.yaml
        
        # Wait for deployments
        kubectl wait --for=condition=available --timeout=300s deployment/opencode-agent -n summit || echo "OpenCode deployment timeout - checking status"
        kubectl wait --for=condition=available --timeout=300s deployment/summit-app -n summit || echo "Summit API deployment timeout - checking status"
        kubectl wait --for=condition=available --timeout=300s deployment/summit-mcp-server -n summit || echo "MCP Server deployment timeout - checking status"

    - name: Verify Deployment
      run: |
        echo "Checking deployment status..."
        kubectl get pods -n summit
        kubectl get services -n summit
        kubectl get deployments -n summit
        echo "OpenCode agent status:"
        kubectl describe deployment/opencode-agent -n summit
        echo "Summit API status:"
        kubectl describe deployment/summit-app -n summit
        echo "MCP Server status:"
        kubectl describe deployment/summit-mcp-server -n summit

  manual-deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Check Authentication Method
      id: auth-check
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      run: |
        if [ -n "${GCP_SA_KEY}" ]; then
          echo "auth_method=service_account" >> $GITHUB_OUTPUT
        elif [ -n "${WIF_PROVIDER}" ]; then
          echo "auth_method=workload_identity" >> $GITHUB_OUTPUT
        else
          echo "auth_method=none" >> $GITHUB_OUTPUT
        fi

    - name: Authenticate to Google Cloud (Service Account)
      if: steps.auth-check.outputs.auth_method == 'service_account'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Authenticate to Google Cloud (Workload Identity)
      if: steps.auth-check.outputs.auth_method == 'workload_identity'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: |
        gcloud auth configure-docker

    - name: Build and Push Docker Images
      run: |
        # Build Summit API image
        docker build -f infrastructure/docker/Dockerfile.summit-api -t gcr.io/${{ env.GCP_PROJECT_ID }}/summit-api:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/summit-api:latest
        
        # Build Summit MCP Server image
        docker build -f infrastructure/docker/Dockerfile.mcp-server -t gcr.io/${{ env.GCP_PROJECT_ID }}/summit-mcp-server:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/summit-mcp-server:latest
        
        # Build OpenCode image
        docker build -f web/Dockerfile.autonomous -t gcr.io/${{ env.GCP_PROJECT_ID }}/opencode:latest .
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/opencode:latest
        
    - name: Manual Terraform Apply
      working-directory: infrastructure/terraform
      run: |
        terraform init
        terraform apply -auto-approve \
          -var="project_id=${{ env.GCP_PROJECT_ID }}" \
          -var="region=${{ env.CLUSTER_REGION }}" \
          -var="cluster_name=${{ env.CLUSTER_NAME }}" \
          -var="create_service_accounts=false" \
          -var="create_iam_bindings=false" \
          -var="enable_apis=false"

    - name: Manual Deploy Applications
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        # Get GKE credentials
        gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
          --region ${{ env.CLUSTER_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }}
        
        # Create namespace if it doesn't exist
        kubectl apply -f infrastructure/kubernetes/shared/namespace.yaml
        
        # Deploy shared resources
        kubectl apply -f infrastructure/kubernetes/shared/service-account.yaml
        
        # Update secrets with actual values
        kubectl create secret generic summit-secrets \
          --from-literal=runpod-api-key="${RUNPOD_API_KEY:-placeholder}" \
          --from-literal=huggingface-token="${HUGGINGFACE_TOKEN:-placeholder}" \
          --from-literal=github-token="${GITHUB_TOKEN:-placeholder}" \
          --from-literal=anthropic-api-key="${ANTHROPIC_API_KEY:-placeholder}" \
          --namespace=summit \
          --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy OpenCode agents
        kubectl apply -f infrastructure/kubernetes/opencode/deployment.yaml
        
        # Deploy Summit API
        kubectl apply -f infrastructure/kubernetes/summit-app/deployment.yaml
        
        # Deploy Summit MCP Server
        kubectl apply -f infrastructure/kubernetes/mcp-server/deployment.yaml
        
        # Wait for deployments
        kubectl wait --for=condition=available --timeout=300s deployment/opencode-agent -n summit || echo "OpenCode deployment timeout - checking status"
        kubectl wait --for=condition=available --timeout=300s deployment/summit-app -n summit || echo "Summit API deployment timeout - checking status"
        kubectl wait --for=condition=available --timeout=300s deployment/summit-mcp-server -n summit || echo "MCP Server deployment timeout - checking status"
        
        # Verify deployment
        kubectl get pods -n summit
        kubectl get services -n summit
        kubectl get deployments -n summit
        echo "MCP Server status:"
        kubectl describe deployment/summit-mcp-server -n summit 