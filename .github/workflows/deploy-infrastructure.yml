name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (skip validation)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infrastructure.yml'

env:
  GCP_PROJECT_ID: summit-ai-platform
  CLUSTER_REGION: us-central1
  CLUSTER_NAME: summit-cluster

jobs:
  # Skip Terraform - infrastructure already exists and is managed manually
  # This workflow now focuses on application deployment only
  
  deploy-applications:
    name: Deploy Applications to Existing Infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
          --region=${{ env.CLUSTER_REGION }} \
          --project=${{ env.GCP_PROJECT_ID }}

    - name: Deploy Summit Applications
      run: |
        # Apply Kubernetes manifests
        kubectl apply -f infrastructure/kubernetes/namespace.yaml
        kubectl apply -f infrastructure/kubernetes/summit-app.yaml
        kubectl apply -f infrastructure/kubernetes/opencode-agent.yaml
        
        # Wait for deployments to be ready
        kubectl rollout status deployment/summit-app -n summit --timeout=300s
        kubectl rollout status deployment/opencode-agent -n summit --timeout=300s

    - name: Verify Deployment
      run: |
        echo "=== Deployment Status ==="
        kubectl get pods -n summit
        kubectl get services -n summit
        
        echo "=== Application Health ==="
        kubectl get deployment summit-app -n summit -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
        kubectl get deployment opencode-agent -n summit -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 