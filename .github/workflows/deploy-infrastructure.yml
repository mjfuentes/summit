name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (skip validation)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infrastructure.yml'

env:
  GCP_PROJECT_ID: summit-ai-platform
  CLUSTER_REGION: us-central1
  CLUSTER_NAME: summit-cluster

jobs:
  # Infrastructure is managed manually outside CI/CD
  # This workflow provides validation and status reporting only
  
  validate-infrastructure:
    name: Validate Infrastructure Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Kubernetes Manifests
      run: |
        echo "=== Validating Kubernetes Manifests ==="
        
        # Check if manifest files exist
        if [ -f "infrastructure/kubernetes/namespace.yaml" ]; then
          echo " Namespace manifest found"
          kubectl --dry-run=client apply -f infrastructure/kubernetes/namespace.yaml
        else
          echo " Namespace manifest not found"
        fi
        
        if [ -f "infrastructure/kubernetes/summit-app.yaml" ]; then
          echo " Summit app manifest found"
          kubectl --dry-run=client apply -f infrastructure/kubernetes/summit-app.yaml
        else
          echo " Summit app manifest not found"
        fi
        
        if [ -f "infrastructure/kubernetes/opencode-agent.yaml" ]; then
          echo " OpenCode agent manifest found"
          kubectl --dry-run=client apply -f infrastructure/kubernetes/opencode-agent.yaml
        else
          echo " OpenCode agent manifest not found"
        fi

    - name: Validate Application Configuration
      run: |
        echo "=== Application Configuration Status ==="
        echo "Infrastructure deployment is managed manually"
        echo "Kubernetes cluster: ${{ env.CLUSTER_NAME }} in ${{ env.CLUSTER_REGION }}"
        echo "Project: ${{ env.GCP_PROJECT_ID }}"
        echo ""
        echo "Manual deployment steps:"
        echo "1. Authenticate to GCP: gcloud auth login"
        echo "2. Get cluster credentials: gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} --region=${{ env.CLUSTER_REGION }} --project=${{ env.GCP_PROJECT_ID }}"
        echo "3. Apply manifests: kubectl apply -f infrastructure/kubernetes/"
        echo "4. Check status: kubectl get pods -n summit"

    - name: Check CI/CD Configuration
      run: |
        echo "=== CI/CD Configuration Status ==="
        echo " Workflow validates manifest syntax"
        echo " No GCP authentication required"
        echo " Infrastructure managed outside CI/CD"
        echo ""
        echo "To enable automatic deployment:"
        echo "1. Add GCP_SERVICE_ACCOUNT_KEY secret to GitHub repository"
        echo "2. Ensure service account has kubernetes.clusters.get permission"
        echo "3. Uncomment authentication steps in this workflow" 