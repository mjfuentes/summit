name: Build and Deploy MCP Server Image

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'infrastructure/docker/Dockerfile.mcp-server'
      - 'requirements.txt'
      - '.github/workflows/build-mcp-server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'infrastructure/docker/Dockerfile.mcp-server'
      - 'requirements.txt'
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install -r requirements.txt
        pip install pytest coverage pytest-xdist pytest-cov
        
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml -n auto
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: mcp-server
        name: mcp-server-coverage
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Run security scan in parallel with tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-security-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-security-pip-
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt
        
    - name: Run Safety dependency scan
      run: |
        safety check --json || true
        
    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: ${{ github.event.pull_request.head.sha || github.sha }}
        extra_args: --debug --only-verified
      continue-on-error: true
      if: github.event_name == 'pull_request'

  build:
    name: Build & Push MCP Server Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      primary-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mcp
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
          
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-mcp
          type=ref,event=pr,suffix=-mcp
          type=sha,prefix={{branch}}-mcp-
          type=raw,value=mcp,enable={{is_default_branch}}
          type=raw,value=mcp-stable,enable={{is_default_branch}}
          type=raw,value=mcp-{{date 'YYYY-MM-DD-HHmmss'}},enable={{is_default_branch}}
          
    - name: Build and push MCP Server image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infrastructure/docker/Dockerfile.mcp-server
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Use GitHub Actions cache only
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Build optimizations
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          PYTHON_VERSION=${{ env.PYTHON_VERSION }}
        
    - name: Generate SBOM (parallel with vulnerability scan)
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: spdx-json
        output-file: /tmp/sbom.spdx.json
      continue-on-error: true
        
    - name: Scan image for vulnerabilities
      uses: anchore/scan-action@v3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        fail-build: false
        severity-cutoff: high
      continue-on-error: true

    - name: Generate build summary
      run: |
        echo "##  MCP Server Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Image Built Successfully" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mcp\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Available Tags" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Manual Deployment Commands" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Update MCP server deployment" >> $GITHUB_STEP_SUMMARY
        echo "kubectl set image deployment/summit-mcp-server mcp-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mcp -n summit" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Apply updated manifests" >> $GITHUB_STEP_SUMMARY
        echo "kubectl apply -f infrastructure/kubernetes/mcp-server/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Check deployment status" >> $GITHUB_STEP_SUMMARY
        echo "kubectl rollout status deployment/summit-mcp-server -n summit" >> $GITHUB_STEP_SUMMARY
        echo "kubectl get pods -n summit -l app=summit-mcp-server" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Check MCP server health" >> $GITHUB_STEP_SUMMARY
        echo "kubectl port-forward svc/summit-mcp-service 8080:8080 -n summit &" >> $GITHUB_STEP_SUMMARY
        echo "curl http://localhost:8080/health" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Troubleshooting" >> $GITHUB_STEP_SUMMARY
        echo "- **Logs**: \`kubectl logs -l app=summit-mcp-server -n summit\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Events**: \`kubectl get events -n summit --sort-by='.lastTimestamp'\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Service**: \`kubectl describe svc summit-mcp-service -n summit\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Update Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate deployment summary
      run: |
        echo "##  MCP Server Deployment Ready" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Image Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Primary Tag**: \`${{ needs.build.outputs.primary-tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Digest**: \`${{ needs.build.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Time**: \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Quick Deployment" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "kubectl set image deployment/summit-mcp-server mcp-server=${{ needs.build.outputs.primary-tag }} -n summit" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Full Deployment Process" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "kubectl apply -f infrastructure/kubernetes/mcp-server/" >> $GITHUB_STEP_SUMMARY
        echo "kubectl rollout status deployment/summit-mcp-server -n summit" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Status" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: SUCCESS" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Scan**: COMPLETED" >> $GITHUB_STEP_SUMMARY
        echo "- **Ready for Deployment**: YES" >> $GITHUB_STEP_SUMMARY 