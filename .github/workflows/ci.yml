name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist
        
    - name: Run tests with coverage
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -n auto
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SUMMIT_READONLY_MODE: true
        
    - name: Run autonomous integration tests
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        # Run autonomous tests separately to catch server startup issues
        python -m pytest tests/test_autonomous_integration.py::TestAutonomousIntegration::test_autonomous_server_syntax -v --no-cov
        python -m pytest tests/test_autonomous_integration.py::TestAutonomousIntegration::test_autonomous_server_startup -v --no-cov
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SUMMIT_READONLY_MODE: true
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Code Quality Disabled
      run: echo "Code quality checks disabled for autonomous development"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r src/ web/ -f json -o bandit-report.json || true
        
    - name: Check for secrets in code
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: ${{ github.event.pull_request.head.sha || github.sha }}
        extra_args: --debug --only-verified
      continue-on-error: true
      if: github.event_name == 'pull_request'

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test server startup with comprehensive checks
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        cd web
        
        # Test 1: Check import and syntax
        python -c "import autonomous_server; print(' Import successful')" || exit 1
        
        # Test 2: Test FastAPI app creation
        python -c "from autonomous_server import app; print(' FastAPI app created successfully')" || exit 1
        
        # Test 3: Test server startup with better error handling
        timeout 30s python autonomous_server.py &
        SERVER_PID=$!
        
        # Wait for server to start
        echo " Waiting for server to start..."
        for i in {1..20}; do
          if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
            echo " Server started successfully"
            break
          fi
          echo "   Attempt $i/20..."
          sleep 1
        done
        
        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1
        echo " Health check passed"
        
        # Test API status endpoint
        curl -f http://localhost:8000/api/summit/status || exit 1
        echo " API status check passed"
        
        # Cleanup
        kill $SERVER_PID 2>/dev/null || pkill -f autonomous_server.py || true
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SUMMIT_READONLY_MODE: true 