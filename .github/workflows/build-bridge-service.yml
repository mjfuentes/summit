name: Build and Deploy Bridge Service

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge-service/**'
      - '.github/workflows/build-bridge-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bridge-service/**'
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bridge-service
  CONTEXT_PATH: bridge-service
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'summit-ai-platform' }}
  GKE_CLUSTER: summit-cluster
  GKE_ZONE: us-central1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.CONTEXT_PATH }}
        file: ${{ env.CONTEXT_PATH }}/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-gke:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

    - name: Deploy to GKE
      run: |
        # Apply Kubernetes manifests
        kubectl apply -f ${{ env.CONTEXT_PATH }}/k8s-deployment.yaml
        
        # Force rollout restart to use new image
        kubectl rollout restart deployment/bridge-service -n summit
        
        # Wait for rollout to complete
        kubectl rollout status deployment/bridge-service -n summit --timeout=300s

    - name: Verify deployment
      run: |
        echo " Checking bridge service deployment..."
        kubectl get pods -n summit -l app=bridge-service
        kubectl get service bridge-service -n summit
        
        # Check if service is responding
        echo " Waiting for service to be ready..."
        sleep 30
        
        # Get service endpoint
        SERVICE_IP=$(kubectl get service bridge-service -n summit -o jsonpath='{.spec.clusterIP}')
        echo " Bridge service available at: http://$SERVICE_IP:8000"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
        timeout: '10m'
      continue-on-error: true

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Generate deployment summary
      run: |
        echo "##  Bridge Service Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Successfully Deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Cluster**: ${{ env.GKE_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: summit" >> $GITHUB_STEP_SUMMARY
        echo "- **Service**: bridge-service:8000" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###  Access Points" >> $GITHUB_STEP_SUMMARY
        echo "- **Internal**: \`http://bridge-service.summit.svc.cluster.local:8000\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Health Check**: \`/health\`" >> $GITHUB_STEP_SUMMARY
        echo "- **OpenAI API**: \`/v1/chat/completions\`" >> $GITHUB_STEP_SUMMARY 