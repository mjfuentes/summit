name: Claude Code Deployment

on:
  push:
    paths:
    - 'web/opencode_task.sh'
    branches: [main]
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/opencode

jobs:
  validate:
    name: Validate Deployment Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Validate required files
      run: |
        echo "Checking for required OpenCode deployment files..."
        MISSING_FILES=()
        
        # Check Dockerfile.autonomous
        if [ ! -f "web/Dockerfile.autonomous" ]; then
          MISSING_FILES+=("web/Dockerfile.autonomous")
        fi
        
        # Check opencode_task.sh
        if [ ! -f "web/opencode_task.sh" ]; then
          MISSING_FILES+=("web/opencode_task.sh")
        fi
        
        # Check requirements.txt
        if [ ! -f "requirements.txt" ]; then
          MISSING_FILES+=("requirements.txt")
        fi
        
        # Check if any files are missing
        if [ ${#MISSING_FILES[@]} -ne 0 ]; then
          echo " Missing required files:"
          for file in "${MISSING_FILES[@]}"; do
            echo "  - $file"
          done
          exit 1
        fi
        
        echo " All required files found"
        
    - name: Validate file permissions and content
      run: |
        echo "Validating deployment files..."
        
        # Check that Dockerfile.autonomous exists and has content
        if [ ! -s "web/Dockerfile.autonomous" ]; then
          echo " Dockerfile.autonomous is empty"
          exit 1
        fi
        
        # Check that opencode_task.sh has proper shebang
        if ! head -n 1 "web/opencode_task.sh" | grep -q "#!/bin/bash"; then
          echo " opencode_task.sh missing proper shebang"
          exit 1
        fi
        
        echo " File validation passed"

  build:
    name: Build OpenCode Image
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Prepare build context
      run: |
        echo "Preparing OpenCode build context..."
        cd web
        
        # Copy requirements.txt from parent directory
        cp ../requirements.txt .
        echo " Copied requirements.txt to build context"
        
        # Verify opencode_task.sh is executable
        chmod +x opencode_task.sh
        echo " Made opencode_task.sh executable"
        
        # List files in build context
        echo " Build context contents:"
        ls -la
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./web
        file: ./web/Dockerfile.autonomous
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

  test:
    name: Test OpenCode Container
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify image availability
      run: |
        echo " Verifying image availability..."
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Checking image: $IMAGE_TAG"
        
        # Wait a moment for image to be available in registry
        sleep 5
        
        # Check if image exists in registry
        if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
          echo " Image found in registry"
        else
          echo " Image not found in registry, retrying in 10 seconds..."
          sleep 10
          if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo " Image found in registry after retry"
          else
            echo " Image still not available in registry"
            exit 1
          fi
        fi
        
    - name: Test container startup
      run: |
        echo " Testing container startup..."
        
        # Extract the image tag from the build step
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Testing image: $IMAGE_TAG"
        
        # Try to run the container with a simple test (removed --rm for debugging)
        echo "Starting container..."
        CONTAINER_ID=$(docker run -d \
          -e ANTHROPIC_API_KEY="test-key" \
          -e TASK_DESCRIPTION="echo 'Hello OpenCode'" \
          -e TIMEOUT_MINUTES=1 \
          --name opencode-test \
          "$IMAGE_TAG")
        
        echo "Container ID: $CONTAINER_ID"
        
        # Give it a moment to start and show immediate logs
        sleep 3
        echo " Container logs (first 3 seconds):"
        docker logs opencode-test || echo "No logs yet"
        
        # Wait a bit more and check status
        sleep 7
        echo " Container status after 10 seconds:"
        docker ps -a | grep opencode-test || echo "Container not found"
        
        # Show full logs
        echo " Complete container logs:"
        docker logs opencode-test 2>&1 || echo "No logs available"
        
        # Check if container is running or exited cleanly
        if docker ps | grep -q opencode-test; then
          echo " Container is still running - SUCCESS!"
          docker stop opencode-test
          docker rm opencode-test
        elif docker ps -a | grep opencode-test | grep -q "Exited (0)"; then
          echo " Container exited successfully - SUCCESS!"
          docker rm opencode-test
        else
          echo " Container failed or exited with error"
          docker ps -a | grep opencode-test || echo "Container not found in ps -a"
          docker rm opencode-test 2>/dev/null || echo "No container to remove"
          exit 1
        fi

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        IMAGE_URL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      run: |
        echo " Deploying OpenCode to Render..."
        
        # Prepare deployment script
        cat > deploy_to_render.py << 'EOF'
        import os
        import requests
        import json
        import time
        
        api_key = os.environ.get('RENDER_API_KEY')
        service_id = os.environ.get('RENDER_SERVICE_ID') 
        image_url = os.environ.get('IMAGE_URL')
        
        if not all([api_key, service_id, image_url]):
            print("Missing required environment variables")
            exit(1)
            
        headers = {
            'Authorization': f'Bearer {api_key}',
            'Content-Type': 'application/json'
        }
        
        # Update service with new image
        update_data = {
            'service': {
                'image': {
                    'imageUrl': image_url
                }
            }
        }
        
        response = requests.patch(
            f'https://api.render.com/v1/services/{service_id}',
            headers=headers,
            json=update_data
        )
        
        if response.status_code == 200:
            print(f" Deployment initiated successfully")
            print(f"Image: {image_url}")
        else:
            print(f" Deployment failed: {response.status_code}")
            print(response.text)
            exit(1)
        EOF
        
        python deploy_to_render.py
        
    - name: Health check
      run: |
        echo " Running post-deployment health check..."
        # Add health check logic here once service is deployed
        echo " Health check placeholder - add actual endpoint check"
        
    - name: Cleanup build context
      run: |
        cd web
        # Clean up copied files
        rm -f requirements.txt
        chmod +x opencode_task.sh
        echo " Cleaned up build context"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo " OpenCode Deployment Summary"
        echo "=================================="
        echo "Status: ${{ needs.deploy.result }}"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Deployment: ${{ github.sha }}"
        echo "Timestamp: $(date)" 